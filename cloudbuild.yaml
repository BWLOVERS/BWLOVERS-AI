steps:
  # Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/bw-ai-server:$COMMIT_SHA', '.']
  
  # 이미지를 Container Registry에 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bw-ai-server:$COMMIT_SHA']
  
  # Cloud Run에 배포
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'bw-ai-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/bw-ai-server:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'  # 5분 타임아웃 (AI 처리 시간 고려)
      - '--max-instances'
      - '10'   # 최대 인스턴스 수
      - '--min-instances'
      - '0'    # 최소 인스턴스 수 (비용 절감)